name: Build TKM AirGap Share APK

on:
  push:
    branches: [airgap-share]
    paths:
      - 'TKM-AirGap-Share/**'
      - '.github/workflows/airgap-share-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'TKM-AirGap-Share/**'
      - '.github/workflows/airgap-share-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p TKM-AirGap-Share --no-daemon assembleDebug --stacktrace
      - name: Rename APK
        run: cp TKM-AirGap-Share/app/build/outputs/apk/debug/app-debug.apk TKM-AirGap-Share-v2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TKM-AirGap-Share-v2-APK
          path: TKM-AirGap-Share-v2.0.apk
          if-no-files-found: error
